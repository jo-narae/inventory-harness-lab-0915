# 유지보수 계약서 — 에이전트가 작업을 시작하는 데 필요한 6개 항목
# 규칙 원본은 docs/harness/01-ssot.md(SSOT). 이 Issue가 SSOT와 충돌하면 에이전트는 중단한다 (SSOT §0 충돌 정책).
name: 유지보수 작업
description: 버그 수정 · 개선 · 정리 작업을 에이전트에게 맡기는 계약서
title: "[유지보수] "
body:
  - type: markdown
    attributes:
      value: |
        6개 항목이 모두 채워져야 에이전트가 작업을 시작한다.
        이 Issue가 SSOT의 `REQ-*` · `ARCH-*` · 하네스 규칙과 충돌하면 에이전트는 구현하지 않고 `NEEDS_HUMAN`을 선언한다 ([SSOT §0](../blob/main/docs/harness/01-ssot.md)).

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 필요한가 — 현상, 재현 방법, 관련 규칙(`REQ-*` · `ARCH-*`)이나 문서 절
      placeholder: |
        - 현상: 팝업 정산 화면에서 반입 수량이 반출보다 크면 판매량이 음수로 표시된다
        - 재현: 팝업 생성 → 반출 3 → 반입 5 입력
        - 관련 규칙: REQ-4, REQ-7
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 2. 변경할 내용
      description: 무엇을 수정하는가 — 바꿀 동작과 대상 파일 · 모듈
      placeholder: |
        - 반입 수량이 누적 반출을 넘으면 입력을 거부하고 사유를 보여준다
        - 대상: src/lib/popup.ts, src/actions/popup.ts
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 종료 조건 작성법
        테스트로 **참 · 거짓을 판정할 수 있는 규칙**으로 쓴다. 한 줄에 다음 세 가지가 드러나야 한다.

        - **조건** — 어떤 데이터 관계 · 상태에서 (예: 반입이 누적 반출보다 크다, 유통기한이 오늘 이전이다)
        - **동작** — 무엇을 실행하면 (예: 반입 입력, 출고 배분, 정산)
        - **기대 결과** — 무엇이 성립해야 하는가 (예: 거부된다, 입력 전후 값이 같다, `A = B − C`)

        **특정 숫자 · 날짜는 쓰지 않는다.** "반출 3개 · 반입 5개"처럼 쓰면 그 한 경우만 확인하게 된다.
        대신 크다 · 작다 · 같다 같은 비교, 계산식, 입력 전후 비교, 오늘 기준의 상대 표현으로 쓴다. 실제 값은 테스트가 고른다 (4-2).

        | ✅ 되는 예 | ❌ 모호함 | ❌ 특정 값에 묶임 |
        |---|---|---|
        | 반입 수량이 그 팝업의 누적 반출보다 크면 오류가 나고, 로트 수량과 `Movement` 건수가 입력 전과 같다 | 반입 수량 검증이 잘 된다 | 반출 3개인 팝업에 반입 5개를 넣으면 오류가 난다 |
        | 정산 판매량은 `누적 반출 − 반입`과 같다 | 판매량이 정확하게 나온다 | 반출 10개 · 반입 4개면 판매량이 6이다 |
        | 유통기한이 오늘 이전인 로트는 출고 배분(`planAllocation`) 결과에 없다 | 만료 재고를 적절히 처리한다 | 2026-09-14 만료 로트는 출고 배분에 없다 |
        | 일반 출고는 유통기한이 가장 이른 로트부터 배분한다 | FEFO가 적용된다 | D+30 · D+500 로트가 있으면 D+30에서 먼저 빠진다 |

        화면에서만 확인할 수 있는 조건은 끝에 `(수동)`을 붙인다. 테스트 환경이 `node`라 화면 · Server Action은 자동 검증 밖이다 ([02-verification §4](../blob/main/docs/harness/02-verification.md)).

  - type: textarea
    id: done-criteria
    attributes:
      label: 3. 종료 조건
      description: 무엇이 참이면 완료인가 — 조건 · 동작 · 기대 결과를 비교 · 계산식 · 전후 비교로 한 줄에 하나씩. 특정 숫자 · 날짜는 쓰지 않는다. 번호(C1, C2 …)는 4번 테스트와 연결하는 데 쓴다. verify 통과만으로는 완료가 아니다 (VER-5)
      placeholder: |
        - [ ] C1. 반입 수량이 그 팝업의 누적 반출보다 크면 오류가 나고, 로트 수량과 Movement 건수가 입력 전과 같다
        - [ ] C2. 반입 수량이 누적 반출 이하이면 반입이 기록되고, 정산 판매량은 `누적 반출 − 반입`과 같다
        - [ ] C3. 반입이 거부되면 입력란 아래에 거부 사유가 보인다 (수동)
    validations:
      required: true

  - type: input
    id: test-name
    attributes:
      label: 4-1. 테스트 기능명
      description: |
        종료 조건을 검증할 테스트 파일 이름에 들어간다. 영문 소문자 kebab-case로 적는다.
        파일 경로: `tests/issues/issue-{이 Issue 번호}-{기능명}.test.ts` — 예: Issue #12 → `tests/issues/issue-12-popup-return-limit.test.ts`
      placeholder: popup-return-limit
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4-2. 기계 검증
      description: |
        어떤 테스트가 판정하는가 — 3번의 자동 검증 조건(`(수동)` 제외)마다 위 파일에 `it` 하나를 둔다. 테스트 이름은 조건 번호로 시작한다.
        종료 조건에는 숫자가 없으므로 구체적인 값은 테스트가 고른다. 조건이 바뀌는 경계(같을 때 · 하나 넘을 때 · 오늘 당일)를 꼭 넣고, 날짜는 `today()` · `addDays()`로 상대 계산한다.
        이 테스트는 변경 전 코드에서 실패하고 변경 후에 통과해야 한다. `tests/`의 기존 테스트처럼 자기가 만든 데이터만 쓰고 끝나면 지운다.
      value: |
        - 테스트 파일: `tests/issues/issue-{번호}-{기능명}.test.ts`
        - 조건 ↔ 테스트
          - C1 → `it('C1. …')`
          - C2 → `it('C2. …')`
        - 수동 확인: (없으면 "없음")
        - [ ] 변경 전 코드에서 위 테스트가 실패하는 것을 확인
        - [ ] `npm run verify` 통과 (VER-1) — 새 테스트도 여기에 포함된다
    validations:
      required: true

  - type: textarea
    id: do-not-touch
    attributes:
      label: 5. 건드리면 안 되는 것
      description: 변경 경계는 어디인가 — 아래 기본 보호 영역(SSOT §0)에 이 작업에서만 막을 파일 · 모듈을 더한다
      value: |
        - `docs/harness/` (SSOT 포함) — 읽기 전용
        - SSOT §1 · §2, 원문 `docs/01-requirements.md` · `docs/06-architecture.md` — 읽기 전용
        - 검증 스크립트 (`scripts/check-architecture.ts`, `scripts/prepare-verify.ts`, `package.json`의 verify 스크립트, `.github/workflows/`) — 실행만
        - 기존 테스트의 기대값 — 바꿔야 하면 전제를 사람에게 검토받는다 (VER-4)
        - 이 작업에서 추가로 막을 것:
    validations:
      required: true

  - type: dropdown
    id: max-loops
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 몇 번까지 재시도하는가 — 이 횟수 안에 종료 조건을 채우지 못하면 멈추고 `NEEDS_HUMAN`으로 넘긴다
      options:
        - "3회"
        - "1회"
        - "5회"
      default: 0
    validations:
      required: true
