# npm run verify — 준비 → 타입 → 린트 → 아키텍처 → 테스트 → 빌드
# PR과 main push마다 로컬과 같은 파이프라인을 돌린다.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소한다. main은 모든 커밋을 끝까지 검증한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # .env는 커밋하지 않으므로 CI에서 직접 준다 — CI 전용 더미 값
      DATABASE_URL: file:./prisma/dev.db
      SESSION_SECRET: ci-only-session-secret-not-for-production
      # 시드와 유통기한 판정이 '오늘' 기준이라 로컬(한국 시간)과 같은 시간대로 고정한다
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
